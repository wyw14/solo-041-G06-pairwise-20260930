<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BioTreat 采样送检</title><link rel="stylesheet" href="/assets/app.css"></head>
<body><header><div class="brand">BioTreat 工艺联控</div><nav><a href="/process">工艺总控</a><a href="/aeration">曝气调节</a><a href="/sludge">污泥回流</a><a aria-current="page" href="/sampling">采样送检</a><a href="/alarms">异常处置</a></nav></header>
<main>
  <div class="page-head"><div><h1>人工采样送检链条</h1><div class="muted">采样点 · 处理批次 · 采样者 · 封样与实验室接收 · 交接痕迹；丢失或撤销样本不得开出水许可</div></div><div class="status"><span class="dot"></span><span id="health">checking</span></div></div>
  <div class="grid">
    <section class="panel"><h2>登记采样任务</h2>
      <form id="create">
        <label>处理线（取最近样本）<select name="line"><option>line-1</option><option>line-2</option><option>line-3</option></select></label>
        <button type="button" id="loadSamples">读取该线样本</button>
        <label>传感器样本<select name="sample_id"></select></label>
        <label>处理批次（留空用当前活动批次）<input name="batch_id" placeholder="自动绑定当前批次"></label>
        <label>采样者<input name="sampler" value="lab-tech-chen"></label>
        <button>创建采样送检链条</button>
      </form>
    </section>
    <section class="panel"><h2>交接操作</h2>
      <form id="act">
        <label>链条 ID<input name="id" placeholder="选择左侧链条后自动带入"></label>
        <label>操作人<input name="actor" value="lab-tech-chen"></label>
        <div style="display:flex;gap:8px;flex-wrap:wrap">
          <button type="button" data-act="seal">封样</button>
          <button type="button" data-act="receive">实验室接收</button>
          <button type="button" data-act="archive">归档</button>
        </div>
        <div style="display:flex;gap:8px;flex-wrap:wrap">
          <button type="button" class="danger" data-act="lost">标记丢失</button>
          <button type="button" class="danger" data-act="revoke">撤销样本</button>
        </div>
      </form>
    </section>
    <section class="panel wide"><h2>链条交接痕迹</h2><pre id="trace">选择一条链条查看每次交接</pre></section>

    <section class="panel wide"><h2>待接收</h2><table><thead><tr><th>链条</th><th>处理线/采样点</th><th>批次</th><th>采样者</th><th>状态</th><th>封样时间</th><th></th></tr></thead><tbody id="pending"></tbody></table></section>
    <section class="panel wide"><h2>已归档</h2><table><thead><tr><th>链条</th><th>处理线/采样点</th><th>批次</th><th>采样者</th><th>接收时间</th><th>归档时间</th><th></th></tr></thead><tbody id="archived"></tbody></table></section>
    <section class="panel wide"><h2>操作结果</h2><pre id="output">等待操作</pre></section>
  </div>
</main>
<script src="/assets/common.js"></script><script>
const short=v=>v?v.slice(0,8):'-';
const fmt=v=>v?new Date(v).toLocaleString('zh-CN',{hour12:false}):'-';
function row(c,extra){return `<tr><td><a href="#" data-id="${c.id}" class="pick">${short(c.id)}</a></td><td>${c.line_id} / ${c.basin_id||'-'}<br><span class="muted">${c.kind}</span></td><td>${short(c.batch_id)}</td><td>${c.sampler}</td>${extra}<td><button data-id="${c.id}" class="trace">痕迹</button></td></tr>`}
async function load(){
  const p=await request('/api/sampling/pending'), a=await request('/api/sampling/archived');
  document.querySelector('#pending').innerHTML=p.chains.map(c=>row(c,`<td>${c.status}</td><td>${fmt(c.sealed_at)}</td>`)).join('')||'<tr><td colspan="7" class="muted">无待接收链条</td></tr>';
  document.querySelector('#archived').innerHTML=a.chains.map(c=>row(c,`<td>${fmt(c.received_at)}</td><td>${fmt(c.archived_at)}</td>`)).join('')||'<tr><td colspan="7" class="muted">无已归档链条</td></tr>';
  bindRows();
}
function bindRows(){
  document.querySelectorAll('.pick').forEach(x=>x.onclick=e=>{e.preventDefault();document.querySelector('#act [name=id]').value=x.dataset.id});
  document.querySelectorAll('.trace').forEach(b=>b.onclick=async()=>{const c=await request(`/api/sampling/${b.dataset.id}`);document.querySelector('#trace').textContent=(c.transfers||[]).map(t=>`${fmt(t.occurred_at)}  ${t.from||'∅'} → ${t.to}  操作人:${t.actor}${t.note?'  备注:'+t.note:''}`).join('\n')});
}
document.querySelector('#loadSamples').onclick=async()=>{
  const line=document.querySelector('#create [name=line]').value;
  const d=await request(`/api/process-lines/${line}`);
  const sel=document.querySelector('#create [name=sample_id]');
  sel.innerHTML=(d.samples||[]).map(s=>`<option value="${s.id}">${s.kind} #${s.sequence} @ ${s.basin_id||line} (${short(s.id)})</option>`).join('');
  if(d.batch&&d.batch.id)document.querySelector('#create [name=batch_id]').value=d.batch.id;
};
document.querySelector('#create').addEventListener('submit',async e=>{e.preventDefault();const f=new FormData(e.target);try{show(await request('/api/sampling',{method:'POST',body:JSON.stringify({sample_id:f.get('sample_id'),batch_id:f.get('batch_id'),sampler:f.get('sampler')})}));load()}catch(err){showError(err)}});
document.querySelectorAll('#act [data-act]').forEach(btn=>btn.onclick=async()=>{
  const f=new FormData(document.querySelector('#act'));
  const act=btn.dataset.act;let body={actor:f.get('actor')};
  if(act==='lost'||act==='revoke'){body.reason=prompt('请输入原因')||'';}
  try{show(await request(`/api/sampling/${f.get('id')}/${act}`,{method:'POST',body:JSON.stringify(body)}));load()}catch(err){showError(err)}
});
load().catch(showError);
</script></body></html>
